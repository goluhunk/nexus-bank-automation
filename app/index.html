<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Bank | Digital Banking</title>
<style>
:root{--navy:#10243a;--blue:#1769aa;--cyan:#eaf5fb;--ink:#182536;--muted:#66788a;--line:#e3eaf0;--bg:#f4f7fa;--green:#13865b;--red:#bd3b43}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.brand{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:.3px}.brand span{color:var(--blue)}
.user{color:var(--muted);font-size:13px}.layout{display:flex;min-height:calc(100vh - 68px)}
nav{width:235px;background:var(--navy);padding:24px 14px;color:white}nav small{display:block;color:#91a8bd;padding:8px 12px 14px;text-transform:uppercase;letter-spacing:1px;font-size:10px}
nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dce7f0;padding:13px 14px;border-radius:8px;margin:3px 0;cursor:pointer;font-size:14px}
nav button:hover,nav button.active{background:#23435f;color:white}
main{padding:34px;width:100%;max-width:1400px;margin:auto}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px}
h1{font-size:27px;margin:7px 0 8px;color:var(--navy)}.sub{color:var(--muted);margin:0 0 25px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:21px;box-shadow:0 3px 12px #1d38500a}.card label{display:block;color:var(--muted);font-size:12px;margin-bottom:10px}.amount{font-size:25px;font-weight:750;color:var(--navy)}.positive{color:var(--green)}.panel{margin-top:20px;background:white;border:1px solid var(--line);border-radius:13px;padding:22px}.panel h2{font-size:17px;margin:0 0 17px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{background:var(--blue);color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer;font-weight:600}.btn.secondary{background:#edf4f9;color:var(--navy)}.btn.danger{background:var(--red)}input,select{display:block;width:100%;max-width:480px;border:1px solid #ccd7e1;border-radius:7px;padding:12px;margin:7px 0 15px;font-size:14px;background:white}label.field{font-size:13px;font-weight:600;color:#435568}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;background:#f8fafc}.status{color:var(--green);font-weight:700}.muted{color:var(--muted)}.notice{padding:12px 14px;background:#eaf7f0;color:#126943;border-radius:8px;margin:14px 0;display:none}.error{padding:11px 13px;background:#fff0f0;color:#a52c35;border-radius:8px;margin:12px 0;display:none}.login-wrap{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#edf5fa,#f7f9fc)}.login-card{width:100%;max-width:440px;background:white;padding:36px;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px #18334b12}.login-card h1{font-size:25px}.login-card input{max-width:none}.hidden{display:none!important}.reference{font-weight:800;color:var(--green)}@media(max-width:800px){nav{width:180px}.grid{grid-template-columns:1fr}main{padding:20px}header{padding:0 18px}}@media(max-width:560px){.layout{display:block}nav{width:100%;display:flex;overflow:auto;padding:8px}nav small{display:none}nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="brand">NEXUS <span>BANK</span></div><div class="user" id="header-user">Secure digital banking</div></header>
<div id="login-view" class="login-wrap"><section class="login-card">
<div class="eyebrow">Welcome to Nexus Bank</div><h1>Sign in to your account</h1><p class="sub">Manage your money securely, anywhere.</p>
<label class="field" for="username">Username</label><input id="username" autocomplete="username" placeholder="Enter username">
<label class="field" for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 16px"><input type="checkbox" style="width:auto;margin:0"> Remember me</label>
<button class="btn" id="login-button" style="width:100%">Sign in securely</button><div id="login-error" class="error"></div>
<p class="muted" style="font-size:12px;margin-top:20px">Demo credentials: <b>gaurav</b> / <b>Bank@123</b></p>
</section></div>
<div id="bank-view" class="layout hidden">
<nav><small>Banking services</small>
<button class="active" data-page="dashboard">Dashboard</button><button data-page="accounts">Accounts</button><button data-page="transfer">Fund Transfer</button><button data-page="beneficiaries">Beneficiaries</button><button data-page="transactions">Transactions</button><button id="logout">Sign out</button>
</nav><main id="content"></main></div>
<script>
const state={balance:48520.75,savings:32520.75,beneficiaries:[{name:"John Smith",account:"XXXXXX1288",ifsc:"NEXU0000001"},{name:"Aarav Mehta",account:"XXXXXX9912",ifsc:"NEXU0000002"}],transactions:[
{id:"TRX1003",date:"2026-11-20",description:"Salary credit",type:"Credit",amount:65000,status:"Completed"},
{id:"TRX1002",date:"2026-11-19",description:"Utility payment",type:"Debit",amount:2450,status:"Completed"},
{id:"TRX1001",date:"2026-11-18",description:"Online purchase",type:"Debit",amount:1299,status:"Completed"}]};
const $=id=>document.getElementById(id), money=n=>Number(n).toFixed(2);
function showPage(page){document.querySelectorAll("nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const c=$("content");
if(page==="dashboard")c.innerHTML=`<div class="eyebrow">Customer overview</div><h1 id="dashboard-heading">Good morning, <span id="customer-name">Gaurav Singh</span></h1><p class="sub">Here is your financial snapshot for today.</p><div class="grid"><div class="card"><label>Total relationship balance</label><div class="amount" id="total-balance">${money(state.balance)}</div><p class="muted">Across your Nexus accounts</p></div><div class="card"><label>Savings account</label><div class="amount">${money(state.savings)}</div><p class="muted">Available balance</p></div><div class="card"><label>Recent activity</label><div class="amount">${state.transactions.length}</div><p class="muted">Recorded transactions</p></div></div><section class="panel"><h2>Quick actions</h2><div class="actions"><button class="btn" onclick="showPage('transfer')">Transfer money</button><button class="btn secondary" onclick="showPage('accounts')">View accounts</button><button class="btn secondary" onclick="showPage('transactions')">View transactions</button></div></section><section class="panel"><h2>Recent transactions</h2>${transactionTable(state.transactions.slice(0,3))}</section>`;
if(page==="accounts")c.innerHTML=`<div class="eyebrow">Your relationship</div><h1>Accounts</h1><p class="sub">View balances and account information.</p><section class="panel"><h2>Savings account</h2><div class="grid"><div><label class="muted">Account number</label><div id="savings-account-number" class="amount">**** 4821</div></div><div><label class="muted">Available balance</label><div id="savings-available" class="amount">${money(state.savings)}</div></div><div><label class="muted">Account type</label><div class="amount">Savings</div></div></div><p class="muted">Account status: Active · Currency: USD (demo)</p></section><section class="panel"><h2>Current account</h2><p>Account ending 1904 · Balance: $16,000.00</p></section>`;
if(page==="beneficiaries")c.innerHTML=`<div class="eyebrow">Payees</div><h1>Beneficiary management</h1><p class="sub">Manage trusted recipients for transfers.</p><section class="panel"><h2>Add beneficiary</h2><label class="field">Beneficiary name</label><input id="beneficiary-name" placeholder="Full name"><label class="field">Account number</label><input id="beneficiary-account" placeholder="Account number"><label class="field">IFSC code</label><input id="beneficiary-ifsc" placeholder="IFSC code"><button class="btn" id="add-beneficiary">Add beneficiary</button><div class="notice" id="beneficiary-notice"></div></section><section class="panel"><h2>Saved beneficiaries</h2><div id="beneficiary-list">${beneficiaryTable()}</div></section>`;
if(page==="transfer")c.innerHTML=`<div class="eyebrow">Payments</div><h1>Fund transfer</h1><p class="sub">Transfer funds to a saved beneficiary. Demo only; no real money moves.</p><section class="panel"><h2>Transfer details</h2><label class="field">From account</label><select id="source-account"><option>Savings •••• 4821</option></select><label class="field">Beneficiary</label><select id="transfer-beneficiary">${state.beneficiaries.map(b=>`<option>${b.name}</option>`).join("")}</select><label class="field">Amount</label><input id="transfer-amount" type="number" min="1" step=".01" placeholder="0.00"><label class="field">Remarks</label><input id="transfer-remarks" placeholder="Optional note"><button class="btn" id="submit-transfer">Review and confirm</button><div class="error" id="transfer-error"></div><div class="notice" id="transfer-confirmation"><b>Transfer successful.</b><p>Reference: <span id="transaction-reference" class="reference"></span></p></div></section>`;
if(page==="transactions")c.innerHTML=`<div class="eyebrow">Account activity</div><h1>Transaction history</h1><p class="sub">Search and review account transactions.</p><section class="panel"><h2>Search transactions</h2><div class="actions"><input id="transaction-search" placeholder="Search transaction ID or description" style="margin:0"><button class="btn" id="search-transactions">Search</button><button class="btn secondary" id="clear-search">Clear</button></div><div id="transaction-rows" style="margin-top:20px">${transactionTable(state.transactions)}</div></section>`;
}
function transactionTable(rows){return `<table><thead><tr><th>Transaction ID</th><th>Date</th><th>Description</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.id}</td><td>${t.date}</td><td>${t.description}</td><td>${t.type}</td><td>${t.type==="Debit"?"-":"+"}$${money(t.amount)}</td><td class="status">${t.status}</td></tr>`).join("")}</tbody></table>`}
function beneficiaryTable(){return `<table><thead><tr><th>Name</th><th>Account</th><th>IFSC</th></tr></thead><tbody>${state.beneficiaries.map(b=>`<tr><td>${b.name}</td><td>${b.account}</td><td>${b.ifsc}</td></tr>`).join("")}</tbody></table>`}
function enterBank(){ $("login-view").classList.add("hidden");$("bank-view").classList.remove("hidden");$("header-user").textContent="Gaurav Singh · Personal banking";showPage("dashboard");}
$("login-button").addEventListener("click",()=>{if($("username").value==="gaurav"&&$("password").value==="Bank@123"){ $("login-error").style.display="none";enterBank();}else{$("login-error").textContent="Invalid username or password";$("login-error").style.display="block";}});
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("login-button").click()});
document.querySelectorAll("nav button[data-page]").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
$("logout").addEventListener("click",()=>{$("bank-view").classList.add("hidden");$("login-view").classList.remove("hidden");$("username").value="";$("password").value="";$("header-user").textContent="Secure digital banking";});
$("content").addEventListener("click",e=>{
if(e.target.id==="add-beneficiary"){const name=$("beneficiary-name").value.trim(),account=$("beneficiary-account").value.trim(),ifsc=$("beneficiary-ifsc").value.trim();const notice=$("beneficiary-notice");if(!name||!account||!ifsc){notice.textContent="Please complete all beneficiary fields.";notice.style.display="block";return;}if(state.beneficiaries.some(b=>b.account===account)){notice.textContent="Beneficiary account already exists.";notice.style.display="block";return;}state.beneficiaries.push({name,account,ifsc});$("beneficiary-list").innerHTML=beneficiaryTable();notice.textContent="Beneficiary added successfully.";notice.style.display="block";}
if(e.target.id==="submit-transfer"){const amount=Number($("transfer-amount").value),err=$("transfer-error"),ok=$("transfer-confirmation");ok.style.display="none";if(!amount||amount<=0){err.textContent="Enter a valid transfer amount.";err.style.display="block";return;}if(amount>state.savings){err.textContent="Insufficient balance.";err.style.display="block";return;}state.savings-=amount;state.balance-=amount;const ref="NEX"+Date.now().toString().slice(-9);state.transactions.unshift({id:ref,date:new Date().toISOString().slice(0,10),description:"Transfer to "+$("transfer-beneficiary").value,type:"Debit",amount,status:"Completed"});$("transaction-reference").textContent=ref;err.style.display="none";ok.style.display="block";}
if(e.target.id==="search-transactions"){const q=$("transaction-search").value.toLowerCase();$("transaction-rows").innerHTML=transactionTable(state.transactions.filter(t=>(t.id+" "+t.description).toLowerCase().includes(q)));}
if(e.target.id==="clear-search"){$("transaction-search").value="";$("transaction-rows").innerHTML=transactionTable(state.transactions);}
});
</script></body></html>
